[project]
name = "boundaryseverance"
version = "0.1.0"
description = "Does a removed border still bend a city's road network? A geometric permutation test for boundary severance, applied to the Berlin Wall and the Cyprus buffer zone."
requires-python = ">=3.11"
license = { text = "LicenseRef-Leo-Y-Zhang-Proprietary" }
dependencies = [
  # No geospatial stack. scipy supplies the sparse Dijkstra, the k-d tree and
  # the statistics; everything else -- Overpass client, ring assembly,
  # point-in-polygon, barrier rasterisation -- is standard library and numpy.
  # That is deliberate: a reproducibility claim is weaker the more of it
  # depends on binary wheels that may not install on the reader's machine.
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["ruff>=0.6"]

[project.scripts]
boundaryseverance = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat by design: one module per stage of the method section, so the code reads
# alongside the paper rather than against a package hierarchy invented for it.
py-modules = ["cli", "osm", "fetch", "graph", "wall", "segments", "cyprus",
              "barriers", "severance", "localise", "facts", "figures",
              "make_paper", "make_storymap", "validate_wall"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # long lines are fine here; the prose in docstrings carries meaning
  "B905",   # zip() without strict=: every zip in this codebase pairs sequences
            # that are the same length by construction, and adding strict=True
            # everywhere would be noise rather than a check
  "E741",   # a single-letter name is occasionally the clearest one in maths code
  "E402",   # a few modules deliberately import after a sys.path or backend setup
  "E702",   # paired one-line assignments in plotting and setup code read
            # better together than split; an automated split of these was
            # tried and silently broke a test module, so they stay as written
  "B007",   # an unused loop index is clearer than enumerate() in two figure loops
]
