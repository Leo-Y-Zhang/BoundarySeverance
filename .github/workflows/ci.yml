name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Mutation check
        # A suite that has never been observed failing is decoration. This
        # breaks the geometry on purpose and fails the build if the tests do
        # not notice.
        run: python tests/mutation_check.py

      - name: Manuscript renders with every value filled
        # make_paper.py exits non-zero if any placeholder is unfilled, so this
        # catches the text drifting from the result files. It stops before
        # invoking tectonic, which is not installed here.
        run: python make_paper.py
